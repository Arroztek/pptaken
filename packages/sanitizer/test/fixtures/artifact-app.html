<!doctype html>
<html>
<head>
  <title>Tip calculator</title>
  <script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>
  <style>
    :root { --accent: #6d28d9; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #ede9fe, #fff); font-family: system-ui, sans-serif; }
    .app { width: min(480px, 90vw); padding: 32px; border-radius: 16px; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.1); }
    button { background: var(--accent); color: #fff; border: 0; padding: 12px 20px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Tip calculator</h1>
    <p class="today" id="today"></p>
    <label>Bill <input type="number" id="bill" value="50"></label>
    <label>Tip <input type="range" id="tip" min="0" max="30" value="15"></label>
    <p>Total: <strong id="total">57.50</strong></p>
    <button id="calc">Calculate</button>
  </div>
  <script type="application/json" id="presets">{"tips":[10,15,20]}</script>
  <script>
    const presets = JSON.parse(document.getElementById('presets').textContent);
    document.getElementById('today').textContent = dayjs().format('YYYY-MM-DD');
    document.getElementById('calc').addEventListener('click', () => {
      const bill = Number(document.getElementById('bill').value);
      const tip = Number(document.getElementById('tip').value);
      document.getElementById('total').textContent = (bill * (1 + tip / 100)).toFixed(2);
    });
    fetch('https://api.example.org/rates').then((r) => r.json()).catch(() => {});
  </script>
</body>
</html>
