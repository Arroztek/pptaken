<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160" fill="none" role="img" aria-label="A cue light waiting for a signal, linked to a slide with a next arrow">
  <title>Waiting for the cue</title>
  <!-- Two inks: Ink (currentColor) and Spotlight #FFB224. -->
  <!-- Cue light box (the stage manager's signal lamp) -->
  <rect x="22" y="52" width="44" height="56" rx="8" stroke="currentColor" stroke-width="2.5"/>
  <circle cx="44" cy="72" r="9" fill="#FFB224"/>
  <circle cx="44" cy="72" r="15" stroke="#FFB224" stroke-opacity=".35" stroke-width="3"/>
  <path d="M35 94H53" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M44 108V128M32 128H56" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <!-- The signal travelling -->
  <path d="M76 80H140" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 9"/>
  <!-- Slide 16:9 with the next arrow -->
  <rect x="150" y="56" width="72" height="40.5" rx="3" fill="#FFB224"/>
  <rect x="150" y="56" width="72" height="40.5" rx="3" stroke="currentColor" stroke-width="2.5"/>
  <path d="M182 67.5L190.5 76.25L182 85" stroke="#16181D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Spike marks -->
  <path d="M174 118H184M179 113V123" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</svg>
