# Docker check: builds the image (amd64 only, nothing pushed) and runs the smoke test, so a broken Dockerfile or a
# change that stops the container from starting is caught in the pull request instead of at release time.
# Runs only when something that ends up in the image changes; docs-only or workflow-only changes skip it.
name: Docker check

on:
  pull_request:
    paths:
      - "docker/**"
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".dockerignore"
      - ".github/workflows/docker-check.yml"
  # Also on main with the same path filter, so the build cache on the default branch stays warm for releases.
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".dockerignore"

# A newer push to the same pull request cancels the older, now useless run.
concurrency:
  group: docker-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Build and smoke test (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: pptaken:smoke
          provenance: false
          sbom: false
          cache-from: type=gha,scope=pptaken-amd64
          cache-to: type=gha,scope=pptaken-amd64,mode=max

      - name: Smoke test
        run: sh docker/smoke-test.sh pptaken:smoke

      - name: Image size
        run: docker image ls pptaken:smoke --format 'pptaken:smoke {{.Size}}' >> "$GITHUB_STEP_SUMMARY"
